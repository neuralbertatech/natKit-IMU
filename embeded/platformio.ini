; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
# Phase 2 re-baseline: pioarduino = arduino-esp32 3.3.11 on ESP-IDF 5.5.5 (matches
# natVR's IDF 5.5.x). Replaces official espressif32@6 (stuck on arduino 2.0.17 / IDF 4.4).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = pico32
framework = arduino
# arduino-esp32 3.x / IDF 5.x is larger than the default ~1.3MB app partition
# allows; the IMU flashes over serial (no OTA), so use a single 3MB app partition.
board_build.partitions = huge_app.csv
;framework = espidf
;framework = arduino, espidf  # Phase 2a target — Arduino-as-ESP-IDF-component (blocked: needs libnatkit-core -Werror cleanup + exceptions/config; see notes)
monitor_speed = 115200
# Phase 0 (restore-flow): every dependency is PINNED. Bare git-HEAD deps made
# builds non-reproducible and were the prime regression vector for the
# begin_SPI() boot-loop — a fresh rebuild floated Adafruit_BNO08x's transitive
# deps (Adafruit BusIO / Unified Sensor) to their Sep-2025 releases, and BusIO's
# 1.17.3/1.17.4 SPIDevice rewrite lands in the exact software-SPI transfer path
# begin_SPI() drives. BusIO/Unified Sensor are listed explicitly below so the LDF
# can no longer resolve them to "latest".
lib_deps =
	# --- networking (captive portal / async web server) ---
	https://github.com/me-no-dev/AsyncTCP#ef448a8a1dffe4ec1b72326dd5a26211ff227b49
	https://github.com/me-no-dev/ESPAsyncWebServer#ad3741d159f9cfd50c567e81b67f3bef1dc6d89f
	# --- BNO08x sensor stack (frozen: BNO08x HEAD == 1.2.5 since 2023) ---
	adafruit/Adafruit BNO08x@1.2.5
	adafruit/Adafruit BusIO@1.17.2            # <-- suspect knob: last release BEFORE the Sep-2025 SPIDevice rewrite; confirm on hardware
	adafruit/Adafruit Unified Sensor@1.1.14
	adafruit/Adafruit NeoPixel@1.15.5         # status LED (currently gated off via IMU_STATUS_LED_ENABLED); was transitively pulled by SensorLab
	# --- natKit core (cpp-only branch = the validated frame/heartbeat work) ---
	https://github.com/neuralbertatech/libnatkit-core#c1f0868ee6c85010abd37d38ae6a06ab2b7a24a8
	;third-party/libnatkit-core
	# --- MQTT / NTP ---
	knolleary/PubSubClient@2.8                # the MQTT client actually used
	gmag11/ESPNtpClient@0.2.7
	; https://github.com/espressif/esp-mqtt
	; https://github.com/marian-craciunescu/ESP32Ping

[env:release]
build_type = release
build_unflags = -std=c++98
build_flags =
	-DCORE_DEBUG_LEVEL=5 # no info output on serial
	-DUSE_SERIAL=true #disables the use of the serial port
	-std=c++17
	-O3

[env:debug]
build_type = release
build_unflags = -std=c++98
monitor_speed = 115200 # default esp32
monitor_filters = esp32_exception_decoder
build_flags =
	-DCORE_DEBUG_LEVEL=0 # verbose debug info output on serial
	-DUSE_SERIAL=false #enables the use of the serial port 
	-DDEBUG_ESP_DNS=false #debug dns on serial
	-std=c++17
	-O3

[env:debug_verbose]
build_type = debug
build_unflags = -std=c++98
monitor_speed = 115200 # default esp32
monitor_filters = esp32_exception_decoder
build_flags =
	-DCORE_DEBUG_LEVEL=5 # verbose debug info output on serial
	-DUSE_SERIAL=true #enables the use of the serial port 
	-DDEBUG_ESP_DNS=true #debug dns on serial
	-std=c++17
	-Os